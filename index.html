<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Business-Netzwerk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#0F2A4A; --navy-deep:#0A1D33; --orange:#F28C28; --orange-ink:#B5620F; --orange-soft:#FDF1E4;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#D5DCE5;
  --ink:#16202E; --ink-2:#4E5D70; --ink-3:#7C899A;
  --good:#2E7D5B; --bad:#A83A2E;
  --brand:#0F2A4A; --on-brand:#FFFFFF;
  --shadow:0 1px 2px rgba(15,42,74,.05),0 6px 18px rgba(15,42,74,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1728; --surface:#132238; --surface-2:#1B2E48; --line:#2A3F5C;
    --ink:#E8EEF5; --ink-2:#AEBBCC; --ink-3:#7F8FA4;
    --orange:#F5A04A; --orange-ink:#F5A04A; --orange-soft:#2B2116; --brand:#DCE7F5; --on-brand:#0A1D33;
    --good:#5CC48A; --bad:#E5685A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1728; --surface:#132238; --surface-2:#1B2E48; --line:#2A3F5C;
  --ink:#E8EEF5; --ink-2:#AEBBCC; --ink-3:#7F8FA4;
  --orange:#F5A04A; --orange-ink:#F5A04A; --orange-soft:#2B2116; --brand:#DCE7F5; --on-brand:#0A1D33;
  --good:#5CC48A; --bad:#E5685A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{color:var(--brand);line-height:1.15;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.25rem}
h2{font-size:1.85rem}
h3{font-size:1.15rem}
p{margin:.5rem 0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* Kopf */
.top{background:var(--navy-deep);color:#E8EEF5;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--orange)}
.top .bar{max-width:1060px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.top .brand .mark{width:34px;height:34px;flex:none;border:2px solid var(--orange);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.9rem;letter-spacing:.02em}
.top .brand h1{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;color:#8FA3BC;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;font-weight:500}
.hb{border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:8px 14px;font-size:.88rem;font-weight:600;white-space:nowrap;background:transparent;color:#fff}
.hb.primary{background:var(--orange);border-color:var(--orange);color:#0A1D33}
.hb.attention{box-shadow:0 0 0 3px rgba(242,140,40,.35);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(242,140,40,.35)}50%{box-shadow:0 0 0 6px rgba(242,140,40,.12)}}
.menu{position:relative}
.menu .dd{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:240px;padding:6px;z-index:30}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:6px;font-size:.92rem;color:var(--ink)}
.menu .dd button:hover{background:var(--surface-2)}
.menu .dd hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.steps{background:var(--navy)}
.steps .in{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.steps button{background:none;border:0;color:#B9C7D8;padding:13px 8px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:4px solid transparent;font-size:.95rem;font-weight:600}
.steps button .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #6F86A3;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.steps button.active{color:#fff;border-bottom-color:var(--orange)}
.steps button.active .n{background:var(--orange);border-color:var(--orange);color:#0A1D33}
@media (max-width:640px){.steps button .lbl{display:none}.steps button{padding:10px 4px}}
main{max-width:1060px;margin:0 auto;padding:22px 16px 90px}
/* Bildbanner je Schritt: Text links, Bild rechts */
.banner{position:relative;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:240px;margin-bottom:20px;box-shadow:var(--shadow);background:var(--navy-deep)}
.banner .pic{position:relative;min-height:240px}
.banner .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,center 35%)}
.banner .pic::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0A1D33 0%,rgba(10,29,51,.35) 28%,rgba(10,29,51,0) 60%)}
.banner .in{position:relative;z-index:1;padding:30px 32px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.banner .eyebrow{color:#F5A04A}
.banner h2{color:#fff;font-size:2rem;margin-top:4px}
.banner p{margin:8px 0 0;font-size:1.05rem;color:#C9D5E4;max-width:46ch}
.banner p b{color:#fff}
.banner .in::before{content:'';display:block;width:44px;height:4px;background:var(--orange);border-radius:2px;margin-bottom:12px}
@media (max-width:760px){.banner{grid-template-columns:1fr;min-height:0}.banner .pic{min-height:150px;order:-1}.banner .pic::after{background:linear-gradient(0deg,#0A1D33 0%,rgba(10,29,51,.2) 60%)}.banner .in{padding:18px 20px}.banner h2{font-size:1.45rem}}
.head{margin-bottom:18px;padding-left:16px;border-left:4px solid var(--orange)}
.head p{margin:2px 0 0;font-size:1.05rem;color:var(--ink-2)}
.head p b{color:var(--brand)}
.card{transition:box-shadow .2s ease,transform .2s ease}
.prow:hover,.kpi.cat:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,#F79A3E,#EE8420);border-color:#E67E1E;box-shadow:0 2px 6px rgba(242,140,40,.3)}
.btn.primary:hover{filter:brightness(1.04)}
.steps button{transition:color .2s}
.modal.hero{padding:0;overflow:hidden}
.modal.hero .mimg{height:150px;background:var(--navy-deep);position:relative}
.modal.hero .mimg img{width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.9}
.modal.hero .mimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,29,51,.1),rgba(10,29,51,.75))}
.modal.hero .mbody{padding:20px 24px 22px}
@media (max-width:640px){h2{font-size:1.45rem}}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#0A1D33}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:7px 12px;font-size:.88rem;font-weight:600;line-height:1.2;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-brand)}
.chip.mini{padding:4px 9px;font-size:.78rem}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--orange));flex:none}
.chip.on .dot{outline:2px solid rgba(255,255,255,.55)}
.kw{display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:600;color:var(--brand);font-size:.98rem}
.kw span::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:1px}
.field label{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:4px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.field input[type=text],.field input[type=date],.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);font-size:1rem}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .4s ease}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:calc(100vw - 32px);text-align:center;font-size:.95rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:#F5A04A}
.modal-bg{position:fixed;inset:0;background:rgba(10,29,51,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:4px solid var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-weight:700;font-size:2rem;color:var(--brand);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.74rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:2px}
.kpi.cat{border-top:4px solid var(--c);cursor:pointer}
.kpi.cat.on{background:var(--orange-soft)}
.circles{width:100%;max-width:380px;margin:0 auto;display:block}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px;font-size:.88rem;margin-top:8px}
.legend span{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{color:var(--brand);font-family:"IBM Plex Mono",monospace;font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;margin-bottom:-2px;border-bottom:3px solid transparent;color:var(--ink-2);font-weight:600;white-space:nowrap;font-size:.92rem}
.tabs button.on{color:var(--brand);border-bottom-color:var(--orange)}
.tabs button b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-3);margin-left:4px}

/* Sammeln */
.quick{display:flex;gap:8px;margin-top:12px}
.quick input{flex:1;border:2px solid var(--line);border-radius:6px;padding:13px 16px;font-size:1.1rem;background:var(--surface)}
.quick input:focus{border-color:var(--orange);outline:none}
.pre{background:var(--surface-2);border-radius:6px;padding:12px 14px;margin-top:12px}
.pre .lbl{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.prow .nm{font-weight:700;color:var(--brand);font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .nm .src{font-size:.74rem;color:var(--ink-3);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.prow .tags{grid-column:1/3}
.prow .x{border:0;background:none;color:var(--ink-3);font-size:1.1rem;width:30px;height:30px;border-radius:4px}
.prow .x:hover{background:var(--surface-2);color:var(--bad)}
.prow.sel{border-left:4px solid var(--orange)}
.selbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:.82rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.selbtn.on{background:var(--orange);border-color:var(--orange);color:#0A1D33}

/* Vorbereiten */
.pcard{border-top:4px solid var(--orange)}
.attr{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.attr .lbl{font-size:.78rem;color:var(--ink-2);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.attr .lbl small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.goal{background:var(--orange-soft);border-left:4px solid var(--orange);padding:10px 14px;border-radius:0 6px 6px 0;margin-top:12px}
.goal b{color:var(--brand)}
.tool{background:var(--surface-2);border-left:4px solid var(--navy);padding:12px 16px;border-radius:0 8px 8px 0;margin-top:12px}
.tool h3{margin-top:2px}
.tool .q{font-weight:600;color:var(--brand);font-size:1.02rem;margin:10px 0 6px;line-height:1.45}
.navbtns{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.side{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.9rem}
.side button:hover{background:var(--surface-2)}
.side button.cur{background:var(--orange-soft)}
.side button .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.side button.ok .d{background:var(--good)}
.assess{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:860px){.assess{grid-template-columns:1fr}}

/* Umsetzen */
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .nm{font-weight:700;color:var(--brand)}
.tbl .mini{font-size:.8rem;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.status{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.status button{border:0;background:none;padding:6px 10px;font-size:.8rem;color:var(--ink-2);font-weight:600;white-space:nowrap}
.status button.on{background:var(--navy);color:var(--on-brand)}
.status button.on.k{background:var(--good);color:#fff}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.week div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.week .v{font-weight:700;font-size:1.7rem;color:var(--brand);font-variant-numeric:tabular-nums}
.week .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600}

/* Druck */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.steps,main,.toast,.modal-bg{display:none!important}
  #print{display:block;font-size:11pt}
  #print h1{font-size:24pt;color:#0F2A4A}
  #print h2{font-size:14pt;margin-top:20pt;color:#0F2A4A;border-left:5pt solid #F28C28;padding-left:8pt;page-break-after:avoid}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #print th,#print td{border-bottom:1px solid #999;padding:5pt 6pt;text-align:left;vertical-align:top}
  #print th{font-size:8pt;text-transform:uppercase;letter-spacing:.06em}
  #print .meta{color:#555;font-size:9pt}
  #print .pb{page-break-before:always}
  #print .box{display:inline-block;width:11pt;height:11pt;border:1.5pt solid #0F2A4A;border-radius:2pt;vertical-align:-1pt;margin-right:5pt}
  #print .ln{display:inline-block;border-bottom:1pt solid #888;min-width:55pt;height:11pt}
  #print td.w{height:30pt}
  #print .goalrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8pt;text-align:center;margin:8pt 0}
  #print .goalrow div{border:1.5pt solid #0F2A4A;border-radius:4pt;padding:8pt}
  #print .goalrow .n{font-size:22pt;font-weight:700;color:#0F2A4A}
  #print .goalrow .l{font-size:8pt;text-transform:uppercase;letter-spacing:.06em;color:#555}
  #print .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6pt;margin:8pt 0}
  #print .cats div{border:1pt solid #bbb;border-radius:4pt;padding:6pt 4pt;text-align:center;font-size:8pt}
  #print .cats .n{font-size:18pt;font-weight:700;color:#0F2A4A;display:block}
  #print svg{width:220pt;height:220pt;display:block;margin:0 auto}
  #print .tools{display:grid;grid-template-columns:1fr 1fr;gap:8pt}
  #print .tools div{border:1pt solid #bbb;border-radius:4pt;padding:7pt 9pt;page-break-inside:avoid}
  #print .tools div div{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <div class="brand">
      <div class="mark">CEB</div>
      <div><h1>Mein Business-Netzwerk</h1><small>CEB Bankshop AG · Unternehmensaufbau</small></div>
    </div>
    <button type="button" class="hb primary" id="saveBtn">Sichern</button>
    <button type="button" class="hb" id="loadBtn">Laden</button>
    <div class="menu" id="menu">
      <button type="button" class="hb" id="menuBtn">Menü</button>
      <div class="dd">
        <button type="button" data-act="print"><b>Mein Plan drucken / PDF</b></button>
        <button type="button" data-act="copy">In Zwischenablage kopieren</button>
        <hr>
        <button type="button" data-act="tools">Die fünf Nutzen-Tools</button>
        <button type="button" data-act="demo">Beispiel ansehen</button>
        <button type="button" data-act="privacy">Datenschutz &amp; Regeln</button>
        <hr>
        <button type="button" data-act="reset">Alles löschen</button>
      </div>
    </div>
  </div>
  <nav class="steps" aria-label="Schritte"><div class="in" id="steps"></div></nav>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="print"></div>

<script>
/* =====================================================================
   Mein Business-Netzwerk – CEB Bankshop AG · Version 14 · Die fünf Nutzen-Tools der CEB Bankshop AG in jedem Kontaktgespräch · Bildbanner · Empfehlungen · Kontaktgespräche je Zielgruppe · Speicherung nur in der Browser-Sitzung, dauerhaft als Datei
   Vier Schritte: Erfassen → Zuordnen → Vorbereiten → Umsetzen

function opening(p){
  const near=p.near||2, ch=p.channel||'pers';
  const bezug = near===3 ? 'Du kennst mich – und du weißt, dass ich Dinge zu Ende bringe.' : near===2 ? 'Wir kennen uns lange genug, dass ich dich das direkt fragen kann.' : 'Wir haben uns eine Weile nicht gesprochen – umso mehr freue ich mich, dass ich dich erreiche.';
  const neu = 'Ich habe etwas Neues angefangen: Ich baue mit der CEB Bankshop AG mein eigenes Unternehmen auf – Finanzen, Finanzierung, Vorsorge.';
  if(ch==='tel') return `Hallo ${first(p)}, hier ist ${S.partner.name||'…'}. Hast du zwei Minuten? … ${neu} ${bezug}`;
  if(ch==='msg') return `Hallo ${first(p)}, ${neu.charAt(0).toLowerCase()+neu.slice(1)} ${bezug} Ich würde dir gern in zwei Sätzen erzählen, worum es geht – darf ich dich dazu kurz anrufen? Wann passt es dir?`;
  return `${neu} ${bezug}`;
}
const first = p => (p.name||'').split(/[\s(]/)[0];
function buildScript(p){
  const g = goalOf(p) || 'kunde'; const G = GOALS[g]; const ch = p.channel||'pers';
  const T = TOOLS[toolOf(p)];
  const blocks = [];
  blocks.push(['Einstieg', opening(p)]);
  if(ch==='msg') return blocks.map(([t,x])=>`${t}\n${x}`).join('\n\n') + `\n\nNach dem Ja: Anruf führen – Leitfaden „Telefon“ wählen.`;
  blocks.push([`Leitfrage · ${T.n}`, `${T.frage}\n(Kurzform: ${T.kurz})`]);
  blocks.push(['Nutzen kurz erklären', T.warum]);
  blocks.push([g==='kunde'?'Mein Angebot':'Mein Anliegen', `${G.ask(p)} ${G.bitte}`]);
  blocks.push(['Überleitung zum Termin', T.ueber]);
  blocks.push(['Terminfrage', 'Passt dir Dienstag um 18 Uhr oder Donnerstag um 17 Uhr? Bei dir oder bei mir?']);
  blocks.push(['Empfehlungsfrage', G.ref]);
  blocks.push(['Bestätigung', 'Dann trage ich es ein und schicke dir eine kurze Bestätigung. Danke dir – bis dann.']);
  return blocks.map(([t,x],i)=>`${i+1} · ${t}\n${x}`).join('\n\n');
}

function targetSVG(mode){
  const rings = CATS.slice().reverse();
  const cx=200, cy=200, n=CATS.length, sw=26, rs=CATS.map((c,i)=>52+i*(124/(n-1)));
  const total = mode==='sel' ? selected().length : S.persons.length;
  let s=`<svg class="circles" viewBox="0 0 400 400" role="img" aria-label="Netzwerk-Potenzial" data-count="${total}" data-mode="${mode||''}">`;
  rings.forEach((c,i)=>{
    const r=rs[n-1-i]; const cnt = mode==='sel' ? selected().filter(p=>p.cats.includes(c.id)).length : catCount(c.id); const frac=Math.min(1,cnt/c.cap); const circ=2*Math.PI*r;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.col}" stroke-opacity=".14" stroke-width="${sw}"/>`;
    if(cnt>0) s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.col}" stroke-width="${sw}" stroke-dasharray="${(frac*circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray .8s ease"/>`;
    s+=`<text x="${cx}" y="${cy-r+5}" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="14" fill="${cnt>0?'#fff':'var(--ink-2)'}" style="paint-order:stroke" stroke="${cnt>0?c.col:'none'}" stroke-width="5" stroke-linejoin="round">${cnt}</text>`;
  });
  s+=`<circle cx="${cx}" cy="${cy}" r="${rs[0]-sw/2-2}" fill="var(--surface)"/>`;
  s+=`<text class="cnt" x="${cx}" y="${cy+9}" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="28" fill="var(--brand)">${total}</text></svg>`;
  return s;
}

  $('#quick').onsubmit=e=>{ e.preventDefault(); const k=addNames($('#qname').value); $('#qname').value=''; if(k){ r0(); animateCounts(); } $('#qname').focus({preventScroll:true}); };

function addNames(text){
  const before=S.persons.length;
  text.split(',').map(s=>s.trim()).filter(Boolean).forEach(nm=>{ if(S.persons.some(p=>p.name.toLowerCase()===nm.toLowerCase())){ toast(`„${esc(nm)}“ ist bereits erfasst.`); return; } S.persons.push(newPerson(nm, S.ui.pre.src, S.ui.pre.cats)); });
  const k=S.persons.length-before; save();
  const n=S.persons.length; [25,50,100,150].forEach(m=>{ if(before<m&&n>=m) toast(`<b>${m} Namen.</b> ${m>=100?'Das Netzwerk ist größer als das Gefühl.':'Weiter so.'}`); });
  return k;
}

/* ----- Filter nach Gesprächsziel (Schritt 3 + 4) ----- */

  const cnt=id=>list.filter(p=>goalOf(p)===id).length;
  return `<div class="tabs" id="gtabs"><button type="button" class="${!cur?'on':''}" data-g="">Alle<b>${list.length}</b></button>${CATS.filter(c=>cnt(c.id)).map(c=>`<button type="button" class="${cur===c.id?'on':''}" data-g="${c.id}">${c.name}<b>${cnt(c.id)}</b></button>`).join('')}</div>`;
}
function done(p){ return p.near!==null && !!goalOf(p) && (goalOf(p)!=='kunde' || p.event!==null); }

/* ----- Nutzen-Tool je Person: automatisch aus Ziel und Anlass, per Klick änderbar ----- */

}

/* ----- 3 · Vorbereiten ----- */
function r2(){
  const all=selected(); const gf=S.ui.gfilter;
  const L=gf?all.filter(p=>goalOf(p)===gf):all;
  if(!all.length){ $('#main').innerHTML=`${banner(3,'Schritt 3 von 4','Gespräche vorbereiten','Für jede Person: <b>Ziel, Nähe, Kanal, Nutzen-Tool – und das passende Kontaktgespräch.</b>','words','center 45%')}<div class="card" style="text-align:center;padding:40px"><h3>Noch keine Auswahl</h3><p class="muted">Bitte in Schritt 2 Personen auswählen.</p><button type="button" class="btn primary" data-go="1">Zum Zuordnen</button></div>`; $('#main').querySelector('[data-go]').onclick=()=>go(1); return; }
  if(!L.length){ S.ui.gfilter=null; return r2(); }
  let cur=byId(S.ui.cur); if(!cur||!L.includes(cur)){ cur=L.find(p=>!done(p))||L[0]; S.ui.cur=cur.id; }

  ${banner(3,'Schritt 3 von 4','Gespräche vorbereiten','Für jede Person: <b>Ziel, Nähe, Kanal, Nutzen-Tool – und das passende Kontaktgespräch.</b>','words','center 45%')}

      <div class="attr" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><div class="lbl"><span>Nähe</span></div><div class="chips" data-attr="near">${NEAR.map(x=>`<button type="button" class="chip ${cur.near===x[0]?'on':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
        <div><div class="lbl"><span>Kanal</span></div><div class="chips" data-attr="channel">${CHANNELS.map(x=>`<button type="button" class="chip ${(cur.channel||'pers')===x[0]?'on':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>

      ${toolBox(cur)}

      ${g?`<details class="attr" style="border-top:1px solid var(--line)"><summary style="cursor:pointer;font-weight:700;color:var(--brand);font-size:.9rem">Wenn ein Einwand kommt</summary><div style="margin-top:8px;display:grid;gap:8px">${objectionsFor(g).map(o=>`<div style="background:var(--surface-2);border-radius:6px;padding:9px 12px;font-size:.9rem"><b style="color:var(--brand)">${o[0]}</b><div class="muted" style="margin-top:2px">${o[1]}</div></div>`).join('')}</div></details>`:''}

      <div class="navbtns"><button type="button" class="btn" id="prevP" ${idx===0?'disabled':''}>Zurück</button><button type="button" class="btn primary" id="nextP">${idx<L.length-1?'Speichern und weiter':'Speichern – zur Umsetzung'}</button></div>
    </div>

  </div>`;

/* ----- 4 · Umsetzen ----- */
function r3(){
  const all=selected(); const gf=S.ui.gfilter;
  const L=(gf?all.filter(p=>goalOf(p)===gf):all).sort((a,b)=>STATUS.findIndex(s=>s[0]===a.status)-STATUS.findIndex(s=>s[0]===b.status)||a.name.localeCompare(b.name,'de'));

  ${banner(4,'Schritt 4 von 4','Ansprechen. Termin. Abschluss.','<b>Drei Gespräche pro Woche.</b> Nach Ziel filtern, Status setzen, Termin eintragen – und jede Empfehlung sofort aufnehmen.','man','35% 45%')}

    <div><div class="v">${cnt('termin')}</div><div class="l">Termine</div></div>

    <div style="background:var(--orange-soft);border-color:var(--orange)"><div class="v" style="color:var(--orange-ink)">${thisWeek}<span class="muted" style="font-size:1rem"> / 3</span></div><div class="l">Diese Woche</div></div>
  </div>
  <div class="card">
    ${goalTabs(all, gf)}
    ${L.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>Name</th><th>Ziel</th><th>Status</th><th>Termin</th><th>Empfehlung</th></tr></thead><tbody>${L.map(p=>{const g=goalOf(p); return `<tr><td><span class="nm">${esc(p.name)}</span><div class="mini">${p.cats.map(c=>CAT[c].name).join(' · ')}${p.note?' · '+esc(p.note):''}</div></td><td class="small">${g?CAT[g].goal:'–'}<div class="mini">${(CHANNELS.find(c=>c[0]===(p.channel||'pers'))||[])[1]||''}${' · '+TOOLS[toolOf(p)].n}</div></td><td><div class="status" data-status="${p.id}">${STATUS.map(s=>`<button type="button" class="${p.status===s[0]?'on':''} ${s[0]==='kunde'?'k':''}" data-v="${s[0]}">${s[1]}</button>`).join('')}</div></td><td><input type="date" value="${esc(p.date)}" data-date="${p.id}" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)"></td><td><button type="button" class="btn sm" data-ref="${p.id}">+ Name</button>${(()=>{const R=S.persons.filter(x=>x.ref===p.id); return R.length?`<div class="mini">${R.map(x=>esc(x.name)).join(', ')}</div>`:'';})()}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">Niemand in dieser Ansicht.</p>'}
  </div>
  <div class="card flat" style="margin-top:14px"><div class="kw"><span>Anruf mit Werbezweck nur mit Erlaubnis</span><span>GoldCard: Geschenk und Schutz immer zusammen nennen</span><span>Jedes Gespräch endet mit „Wer fällt dir ein?“</span><span>Vor dem Schließen sichern – der Browser behält nichts</span></div></div>
  <div class="row" style="margin-top:20px;justify-content:space-between"><button type="button" class="btn ghost" data-go="2">Zurück</button><div class="row"><button type="button" class="btn" id="printBtn">Mein Plan drucken / PDF</button><button type="button" class="btn primary" data-go="0">Neue Namen erfassen</button></div></div>`;

/* Empfehlung aus dem Gespräch direkt ins Netzwerk – verknüpft mit dem Empfehlungsgeber */
function askReferral(id){
  const p=byId(id); if(!p) return; let cats=[];
  modal(`<h3>Empfehlung von ${esc(p.name)}</h3><p class="small muted">„Wer fällt dir ein?“ – der Name kommt ins Netzwerk, Quelle: Empfehlung. Kontakt erst nach Ankündigung durch ${esc(first(p))}.</p><div class="field"><label for="refName">Name</label><input type="text" id="refName" placeholder="Vorname Nachname" autocapitalize="words"></div><div class="pre" style="margin-top:10px"><div class="lbl">Zuordnung</div><div class="chips" id="refCats">${catChips([],'mini')}</div></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-close>Abbrechen</button><button type="button" class="btn primary" id="refOk">Aufnehmen</button></div>`, ()=>{
    $('#refName').focus();
    $('#refCats').onclick=e=>{ const b=e.target.closest('[data-cat]'); if(!b) return; const i=cats.indexOf(b.dataset.cat); if(i>=0) cats.splice(i,1); else cats.push(b.dataset.cat); b.classList.toggle('on'); };
    const add=()=>{ const nm=$('#refName').value.trim(); if(!nm) return; if(S.persons.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ toast(`„${esc(nm)}“ ist bereits erfasst.`); return; } const q=newPerson(nm,'empf',cats); q.ref=p.id; q.note=`Empfehlung von ${p.name}`; S.persons.push(q); save(); closeModal(); r3(); toast(`<b>${esc(nm)}</b> aufgenommen – Empfehlung von ${esc(p.name)}.`); };
    $('#refOk').onclick=add; $('#refName').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } };

/* ---------- Druck: Mein Plan ---------- */
function doPrint(){
  const d=new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const all=selected();
  const groups=CATS.map(c=>({c, L:all.filter(p=>goalOf(p)===c.id).sort((a,b)=>STATUS.findIndex(s=>s[0]===a.status)-STATUS.findIndex(s=>s[0]===b.status))})).filter(g=>g.L.length);
  const tbl=L=>`<table><thead><tr><th style="width:26%">Name</th><th style="width:20%">Ziel</th><th>Angesprochen</th><th>Termin am</th><th>Geführt</th><th>Abschluss</th><th>Wer noch?</th></tr></thead><tbody>${L.map((p,i)=>{const g=goalOf(p); return `<tr><td><b>${i+1}. ${esc(p.name)}</b><br><span class="meta">${p.cats.map(c=>CAT[c].name).join(' · ')}${p.note?' · '+esc(p.note):''}</span></td><td class="meta">${g?CAT[g].goal:'–'}<br>${TOOLS[toolOf(p)].n}${p.status!=='offen'?'<br>Stand: '+(STATUS.find(s=>s[0]===p.status)||[])[1]:''}${p.date?' · '+p.date:''}</td><td class="w"><span class="box"></span><span class="ln"></span></td><td class="w"><span class="ln" style="min-width:60pt"></span></td><td class="w"><span class="box"></span></td><td class="w"><span class="box"></span></td><td class="w"></td></tr>`;}).join('')}</tbody></table>`;
  $('#print').innerHTML=`
  <div style="padding:30pt 0 14pt;border-bottom:3pt solid #F28C28;margin-bottom:14pt"><div class="meta" style="letter-spacing:.14em;text-transform:uppercase;color:#B5620F">CEB Bankshop AG · Unternehmensaufbau</div><h1 style="margin:6pt 0 2pt">Mein Plan</h1><div style="font-size:13pt;color:#0F2A4A">${esc(S.partner.name)||'—'} · Stand ${d}</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12pt;align-items:center"><div>${targetSVG()}</div><div><div class="cats">${CATS.map(c=>`<div><span class="n">${catCount(c.id)}</span>${c.name}</div>`).join('')}</div><p class="meta"><b>${S.persons.length}</b> Menschen im Netzwerk · <b>${all.length}</b> in der Auswahl · <b>${all.filter(p=>p.status==='kunde').length}</b> Abschlüsse</p></div></div>
  <h2>Wochenziel</h2>
  <div class="goalrow"><div><div class="n">3</div><div class="l">Gespräche / Woche</div></div><div><div class="n">1</div><div class="l">Termin / Woche</div></div><div><div class="n">${all.length}</div><div class="l">In der Auswahl</div></div><div><div class="n">${catCount('praemie')}</div><div class="l">Prämien zu vergeben</div></div></div>
  ${groups.map((g,i)=>`<h2 class="${i===0?'pb':''}">${g.c.name} – ${g.c.goal} (${g.L.length})</h2>${tbl(g.L)}`).join('')||'<p class="meta">Noch keine Auswahl.</p>'}
  <h2 class="pb">Kontaktgespräche</h2>
  ${all.map(p=>`<div style="page-break-inside:avoid;margin:0 0 14pt;padding:8pt 10pt;border:1pt solid #bbb;border-radius:4pt"><b style="font-size:11.5pt">${esc(p.name)}</b> <span class="meta">· ${goalOf(p)?CAT[goalOf(p)].goal:'–'} · ${(CHANNELS.find(c=>c[0]===(p.channel||'pers'))||[])[1]||''} · ${TOOLS[toolOf(p)].n}</span><pre style="white-space:pre-wrap;font:9.5pt 'IBM Plex Sans',sans-serif;margin:6pt 0 0;line-height:1.4">${esc(p.text||buildScript(p))}</pre></div>`).join('')||'<p class="meta">Noch keine Auswahl.</p>'}
  <h2 class="pb">Die fünf Nutzen-Tools – Spickzettel</h2>
  <div class="tools">${TOOL_IDS.map((t,i)=>{const T=TOOLS[t]; return `<div><div class="meta" style="text-transform:uppercase;letter-spacing:.08em">${i+1} · ${T.tag}</div><b style="font-size:12pt">${T.n}</b><div class="meta">${T.sub}</div><p style="margin:5pt 0;font-weight:600">${T.frage}</p><div class="meta">${T.nutzen.join(' · ')}</div><p class="meta" style="margin:5pt 0 0"><b>Überleitung:</b> ${T.ueber}</p></div>`;}).join('')}</div>
  <p style="border-left:4pt solid #F28C28;padding-left:8pt;margin:10pt 0"><b>Merksatz:</b> ${MERKSATZ}</p>
  <h2>Alle nach Zuordnung</h2>
  <table><thead><tr><th>Zuordnung</th><th>Anzahl</th><th>Namen</th></tr></thead><tbody>${CATS.map(c=>{const P=S.persons.filter(p=>p.cats.includes(c.id)); return P.length?`<tr><td><b>${c.name}</b></td><td>${P.length}</td><td>${P.map(p=>(p.sel?'▪ ':'')+esc(p.name)).join(', ')}</td></tr>`:'';}).join('')}${(()=>{const P=S.persons.filter(p=>!p.cats.length); return P.length?`<tr><td><b>Ohne Zuordnung</b></td><td>${P.length}</td><td>${P.map(p=>esc(p.name)).join(', ')}</td></tr>`:'';})()}</tbody></table>
  <p class="meta" style="margin-top:14pt">▪ = in der Auswahl. Anrufe mit Werbezweck nur mit vorheriger Erlaubnis – persönlich fragen, Datum notieren. Jedes Gespräch endet mit: „Wer fällt dir ein, dem ich helfen könnte?“</p>`;
  window.print();
}

/* ---------- Menü, Sichern, Laden ---------- */
function toast(html){ const t=$('#toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),3200); }
function modal(html,after){ $('#modal').innerHTML=html; $('#modalBg').classList.add('open'); $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal); if(after) after(); }
function closeModal(){ $('#modalBg').classList.remove('open'); $('#modal').classList.remove('hero'); }
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
const menu=$('#menu');
$('#menuBtn').onclick=()=>menu.classList.toggle('open');
document.addEventListener('click',e=>{ if(!menu.contains(e.target)) menu.classList.remove('open'); });
menu.querySelector('.dd').onclick=e=>{ const b=e.target.closest('[data-act]'); if(!b) return; menu.classList.remove('open'); ({print:doPrint, copy:doCopy, tools:showTools, demo:loadDemo, privacy:showPrivacy, reset:doReset})[b.dataset.act](); };
$('#steps').onclick=e=>{ const b=e.target.closest('[data-st]'); if(b) go(parseInt(b.dataset.st,10)); };
$('#saveBtn').onclick=doExport; $('#loadBtn').onclick=doImport;

function exportJSON(){ return JSON.stringify({ app:'Mein Business-Netzwerk', version:14, exportedAt:new Date().toISOString(), partner:S.partner, persons:S.persons }, null, 2); }
async function doExport(){
  const json=exportJSON(); const name=`business-netzwerk-${(S.partner.name||'partner').toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-')}-${new Date().toISOString().slice(0,10)}.json`;
  try{ if(window.claude&&typeof window.claude.use==='function'){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data:json}); dirty=false; markDirty(); toast('Gesichert.'); return; } } }catch(e){ if(e&&e.code==='declined'){ toast('Sichern abgebrochen.'); return; } }
  try{ const blob=new Blob([json],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); dirty=false; markDirty(); toast('Gesichert. Die Datei enthält Namen anderer Menschen – sicher aufbewahren.'); }catch(e){ doCopy(); }
}
async function doCopy(){ try{ await navigator.clipboard.writeText(exportJSON()); toast('In die Zwischenablage kopiert.'); }catch(e){ modal(`<h3>Kopieren</h3><div class="field"><textarea rows="10" readonly>${esc(exportJSON())}</textarea></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-close>Schließen</button></div>`); } }
function convertOld(p){
  const q=newPerson(p.name||'?', p.source==='social'?'insta':'tel', []);
  const r=p.roles||[]; if(r.includes('kunde')) q.cats.push('kunde'); if(r.includes('tueroeffner')||p.multi) q.cats.push('tuer'); if(r.includes('partner')) q.cats.push('mit');
  if(typeof p.near==='number') q.near=p.near>=3?3:p.near===2?2:1; if(p.event) q.event=['trenn','umzug'].includes(p.event)?'none':p.event; if(p.ford) q.note=p.ford;
  if(p.fbStatus==='kunde') q.status='kunde'; if(p.star) q.sel=true;
  return q;
}
function doImport(){
  modal(`<h3>Laden</h3><p class="small muted">Sicherungsdatei wählen – auch ältere Versionen. Vorhandene Namen bleiben, neue kommen dazu.</p><div class="field"><input type="file" id="impFile" accept="application/json,.json"></div><div class="field" style="margin-top:10px"><textarea id="impTa" rows="5" placeholder="… oder gesicherten Text einfügen"></textarea></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-close>Abbrechen</button><button type="button" class="btn primary" id="impOk">Laden</button></div>`, ()=>{
    const apply=txt=>{ try{ const o=JSON.parse(txt); if(!o.persons) throw 0; const old=(o.version||0)<9; let k=0; o.persons.forEach(p=>{ if(S.persons.some(q=>q.name.toLowerCase()===String(p.name).toLowerCase())) return; const np = old?convertOld(p):Object.assign(newPerson(p.name||'?'),p); if(np.star!==undefined){ np.sel=np.sel||!!np.star; delete np.star; } if(np.offer!==undefined) delete np.offer; np.cats=(np.cats||[]).filter(c=>CAT[c]); if(np.goal&&!CAT[np.goal]) np.goal=null; if(np.tool&&!TOOLS[np.tool]) np.tool=null; if(np.event&&!EVENTS.some(e=>e[0]===np.event)) np.event='none'; S.persons.push(np); k++; }); if(o.partner&&!S.partner.name&&o.partner.name) S.partner.name=o.partner.name; S.ui.demo=false; save(true); dirty=false; markDirty(); closeModal(); render(); toast(`<b>${k}</b> Personen geladen${old?' (ältere Sicherung übersetzt)':''}.`); }catch(e){ toast('Das ist keine gültige Sicherung.'); } };
    $('#impOk').onclick=()=>{ const f=$('#impFile').files[0]; if(f){ const r=new FileReader(); r.onload=()=>apply(r.result); r.readAsText(f); } else apply($('#impTa').value); };
  });
}
function doReset(){ modal(`<h3>Alles löschen?</h3><p>Vorher sichern, wenn die Daten erhalten bleiben sollen.</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn" data-close>Abbrechen</button><button type="button" class="btn" id="rsOk" style="color:var(--bad)">Ja, löschen</button></div>`, ()=>{ $('#rsOk').onclick=()=>{ S=fresh(); save(); closeModal(); render(); }; }); }
function showPrivacy(){ modal(`<h3>Datenschutz und Regeln</h3><div class="kw" style="flex-direction:column;gap:10px;margin:12px 0"><span>Keine Speicherung im Browser: beim Schließen ist alles gelöscht</span><span>Dauerhaft nur als Datei auf dem eigenen Rechner – „Sichern“ und „Laden“</span><span>Keine sensiblen Angaben: kein Einkommen, keine Gesundheit</span><span>Anruf, WhatsApp, Mail mit Werbezweck: nur mit Erlaubnis</span><span>Persönlich und per Post: frei</span><span>Nein heißt Nein</span></div><p class="small muted">Fragen: Compliance der CEB Bankshop AG.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn primary" data-close>Verstanden</button></div>`); }

/* ---------- Start ---------- */
const lastStep=S.ui.step; S.ui.step=0; render(); markDirty();
if(S.ui.demo || !S.persons.length){
  const demo=S.ui.demo;
  modal(`<div class="mimg"><img src="${IMG.man}" alt=""></div><div class="mbody"><span class="eyebrow">Mein Business-Netzwerk</span><h3 style="margin-top:.3rem">Ich baue ein Unternehmen auf. Mein Netzwerk hilft mir dabei.</h3><div class="kw" style="flex-direction:column;gap:8px;margin:12px 0"><span>1 · Namen erfassen – Telefon, Instagram, Facebook, LinkedIn</span><span>2 · Zuordnen und die Auswahl treffen</span><span>3 · Gespräche vorbereiten – je Ziel das passende Nutzen-Tool</span><span>4 · Ansprechen, Termin, Abschluss</span></div><p class="small muted"><b>Die Daten werden beim Schließen des Browsers gelöscht.</b> Dauerhaft bleiben sie nur als Datei auf dem eigenen Rechner: „Sichern“ speichert, „Laden“ holt den Stand zurück.</p><div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px"><button type="button" class="btn" id="wLoad">Sicherung laden</button><button type="button" class="btn" id="wDemo">${demo?'Beispiel weiter ansehen':'Beispiel ansehen'}</button><button type="button" class="btn primary" id="wOwn">Neu starten</button></div></div>`, ()=>{ $('#modal').classList.add('hero'); $('#wLoad').onclick=()=>{ closeModal(); doImport(); }; $('#wDemo').onclick=()=>{ closeModal(); if(demo){ S.ui.step=lastStep||1; save(); render(); } else applyDemo(); }; $('#wOwn').onclick=()=>{ closeModal(); if(demo){ S=fresh(); save(); render(); } }; });
} else if(lastStep>0){ toast(`Zuletzt bei <b>${STEPS[lastStep]}</b>.`); }
